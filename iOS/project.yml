# XcodeGen spec. CI runs `xcodegen generate` and builds an unsigned .ipa for AltStore / SideStore,
# which re-sign it with the installer's own Apple ID.
name: Buds
options:
  bundleIdPrefix: dev.kalki
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
targets:
  Buds:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kalki.buds.ios
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Buds
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [bluetooth-central]
        NSBluetoothAlwaysUsageDescription: Buds talks to your earbuds over Bluetooth to read battery and change their settings.
        CFBundleURLTypes:
          - CFBundleURLName: dev.kalki.buds
            CFBundleURLSchemes: [buds]
        ALTAppGroups: [group.dev.kalki.buds]
    entitlements:
      path: App/Buds.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.kalki.buds]
    dependencies:
      - target: BudsWidget
    scheme: {}
  BudsWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.kalki.buds.ios.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Buds
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/BudsWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.dev.kalki.buds]
